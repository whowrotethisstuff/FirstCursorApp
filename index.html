<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Platformer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: system-ui, sans-serif;
      color: #eee;
      gap: 1rem;
      padding: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    p { font-size: 0.9rem; color: #aaa; }
    canvas {
      border: 2px solid #333;
      border-radius: 4px;
      background: #87ceeb;
      display: block;
    }
  </style>
</head>
<body>
    <h1>Pac-Man Platformer</h1>
  <p>Arrow keys / WASD to move &nbsp;·&nbsp; Space to jump</p>
  <canvas id="game" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const WIDTH = 800;
    const HEIGHT = 600;
    const GRAVITY = 0.6;
    const JUMP_STRENGTH = -14;
    const MOVE_SPEED = 6;

    const SKY = '#87ceeb';
    const PACMAN_YELLOW = '#ffdd00';
    const PACMAN_EYE = '#1e1e1e';
    const PLATFORM_COLOR = '#4c994c';
    const GROUND_COLOR = '#654321';

    const platforms = [
      { x: 0, y: HEIGHT - 40, w: WIDTH, h: 40 },
      { x: 150, y: 480, w: 200, h: 20 },
      { x: 450, y: 400, w: 180, h: 20 },
      { x: 80, y: 320, w: 160, h: 20 },
      { x: 350, y: 260, w: 200, h: 20 },
      { x: 600, y: 320, w: 150, h: 20 },
      { x: 250, y: 180, w: 140, h: 20 },
      { x: 500, y: 140, w: 180, h: 20 },
    ];

    const player = {
      x: 100, y: HEIGHT - 120, w: 40, h: 40,
      velX: 0, velY: 0, onGround: false,
      facing: 1, mouthPhase: 0
    };

    const keys = {};

    document.addEventListener('keydown', e => { keys[e.code] = true; });
    document.addEventListener('keyup', e => { keys[e.code] = false; });

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function handleInput() {
      player.velX = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) {
        player.velX = -MOVE_SPEED;
        player.facing = -1;
      }
      if (keys['ArrowRight'] || keys['KeyD']) {
        player.velX = MOVE_SPEED;
        player.facing = 1;
      }
      if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
        player.velY = JUMP_STRENGTH;
        player.onGround = false;
      }
    }

    function applyGravity() {
      player.velY += GRAVITY;
      if (player.velY > 20) player.velY = 20;
    }

    function move() {
      player.x += player.velX;
      for (const p of platforms) {
        if (rectsOverlap(player, p)) {
          if (player.velX > 0) player.x = p.x - player.w;
          else if (player.velX < 0) player.x = p.x + p.w;
        }
      }

      player.y += player.velY;
      player.onGround = false;
      for (const p of platforms) {
        if (rectsOverlap(player, p)) {
          if (player.velY > 0) {
            player.y = p.y - player.h;
            player.velY = 0;
            player.onGround = true;
          } else if (player.velY < 0) {
            player.y = p.y + p.h;
            player.velY = 0;
          }
        }
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > WIDTH) player.x = WIDTH - player.w;
    }

    function draw() {
      ctx.fillStyle = SKY;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      for (const p of platforms) {
        ctx.fillStyle = p.y >= HEIGHT - 40 ? GROUND_COLOR : PLATFORM_COLOR;
        ctx.fillRect(p.x, p.y, p.w, p.h);
      }

      if (player.velX !== 0) player.mouthPhase += 0.28;
      const mouthRad = (8 + Math.abs(Math.sin(player.mouthPhase)) * 32) * Math.PI / 180;
      const cx = player.x + player.w / 2;
      const cy = player.y + player.h / 2;
      const radius = player.w / 2;
      const facingAngle = player.facing > 0 ? 0 : Math.PI;

      ctx.fillStyle = PACMAN_YELLOW;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, facingAngle + mouthRad, facingAngle + Math.PI * 2 - mouthRad);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = PACMAN_EYE;
      ctx.beginPath();
      ctx.arc(cx + 4 * player.facing, cy - 10, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      handleInput();
      applyGravity();
      move();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
